<!DOCTYPE html>
<html>
  <head><title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
  </head>
  <body>
    <section class="info">
      <img src="./eisenhower-matrix.jpg" alt="eisenhower-matrix img">
      <a class="info__more-info" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
    </section>
    <section class="main">
      <h3 for="new-task">Add Item</h3>
      <p id="add-task">
        <div class="main__label-task">
          <input
          id="main__input-task"
          class="main__task"
          type="text"
          >
          <button>Add</button>
        </div>
      <h3>Todo</h3>
      <ul id="incompleted-tasks">
        <li>
          <input type="checkbox">
          <label class="incompleted-tasks__task">Pay Bills</label>
          <input 
          type="text" 
          class="incompleted-tasks__task"
          >
          <button class="incompleted-tasks__edit">Edit</button>
          <button class="incompleted-tasks__delete-btn">
            <img src="./remove.svg" alt="remove logo">
          </button>
        </li>
        <li class="incompleted-tasks__edit-mode">
          <input type="checkbox">
          <label class="incompleted-tasks__task">Go Shopping</label>
          <input 
          type="text" 
          value="Go Shopping" 
          class="incompleted-tasks__task"
          >
          <button class="incompleted-tasks__edit-btn">Save</button>
          <button class="incompleted-tasks__delete-btn">
            <img src="./remove.svg" alt="remove logo">
          </button>
        </li>
      </ul>
      <h3>Completed</h3>
      <ul id="completed-tasks">
        <li>
          <input type="checkbox" checked>
          <label class="completed-tasks__task">See the Doctor</label>
          <input 
          type="text" 
          class="completed-tasks__task"
          >
          <button class="completed-tasks__edit-btn">Edit</button>
          <button class="completed-tasks__delete-btn">
            <img src="./remove.svg" alt="remove logo">
          </button>
        </li>
      </ul>
    </section>
  <script src="app.js"></script>
  </body>
</html>
